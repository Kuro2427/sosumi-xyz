<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><!--# block name="title" -->sosumi.xyz | Interrobang!<!--# endblock --></title>
    <link rel="stylesheet" href="/assets/style.css">
</head>

<style>
    /* Layout specific styles */

    main {
        max-width: 600px;
        margin: auto;
        padding: 1rem;
    }
    
    /* Header styles */
    header{
        margin-top: -10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        border-bottom: 1px solid black;
        margin-bottom: 10px;
    }

    header nav {
        font-weight: bold;
        margin-top: -10px;
    }

    header nav ul {
        list-style: none;
        padding: 0;
        display: flex;
        gap: 1rem;
        justify-content: center;
    }


    /* Article styles */
    .articleTitle {
        font-size: 2rem;
        font-weight: bold;
        margin-bottom: 0px;
    }

    .pubDate {
        margin: 0px;
    }

    article img{
        image-rendering: auto;
    }

    .drop::first-letter{
        font-size: 2rem;
        font-weight: bold;
        float: left;
        line-height: 1;
        padding-right: 8px;
        padding-left: 2px;
    }

    /* Image styles */

    .bigImg{
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 10px;
    }

    .bigImg img{
        width: 100%;
        height: auto;
        padding: 10px;
        border: 1px solid black;
    }

    .rightImg{
        float: right;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-left: 20px;
    }

    .rightImg img{
        width: 250px;
        height: auto;
        padding: 10px;
        border: 1px solid black;
    }

    .leftImg{
        float: left;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-right: 20px;
    }

    .leftImg img{
        width: 250px;
        height: auto;
        padding: 10px;
        border: 1px solid black;
    }

    blockquote::before{
        content: "“";
        font-size: 80px;
        position: absolute;
        margin-left: -40px;
        margin-top: -20px;
    }

    blockquote{
        margin: 0px;
        padding: 5px 5px 5px 20px;
        border: 1px solid black;
    }

    blockquote .quoteCredit{
        text-align: right;
        color: rgb(73, 73, 73);
        margin-top: -15px;
    }


</style>

<body>

    <main>
        <header>
            <a href="/blog/"><img src="logo.png" alt="Interrobang?! (sosumi's blog)" style="padding: 0px; margin: 0px;"></a>
            <nav>
                <ul>
                    <li><a href="/home">sosumi.xyz</a></li>
                    <li><a href="/blog/archive">archive</a></li>
                    <li><a href="/feed.xml">rss</a></li>
                </ul>
            </nav>
        </header>

        <article>
            <!--# block name="content" -->
            <!--# endblock -->
        </article>
    
</body>
</html>
