<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RSS Feed Generator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 2em auto;
      max-width: 900px;
    }
    textarea, input {
      width: 100%;
      margin: 0.5em 0;
    }
    textarea {
      height: 120px;
    }
    .updates {
      margin-top: 1em;
      padding: 1em;
      border: 1px solid #ccc;
      background: #f9f9f9;
    }
    .update-item {
      border-bottom: 1px solid #ddd;
      padding: 0.5em 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .update-text {
      flex-grow: 1;
      margin-right: 1em;
      white-space: pre-wrap;
    }
    button {
      margin: 0.2em;
      padding: 0.4em 0.8em;
    }
  </style>
</head>
<body>
  <h1>RSS Feed Generator</h1>

  <h2>Load Existing Feed</h2>
  <input type="file" id="fileInput" accept=".xml">

  <h2>Add / Edit Update</h2>
  <label for="updateText">Update Text:</label>
  <textarea id="updateText" placeholder="Write your update log here..."></textarea>

  <label for="customDate">Custom Date/Time (optional):</label>
  <input type="datetime-local" id="customDate">

  <label for="customLink">Update Link (optional):</label>
  <input type="url" id="customLink" placeholder="https://example.com/blog/my-post">

  <button id="addUpdate">Add to Feed</button>
  <button id="downloadFeed">Download RSS XML</button>

  <h2>Current Updates</h2>
  <div id="updatesList" class="updates"></div>

  <h2>Generated RSS Feed</h2>
  <textarea id="rssOutput" readonly></textarea>

  <script>
    const updates = [];
    const siteTitle = "sosumi.xyz";
    const siteLink = "https://sosumi.xyz/";
    const siteDescription = "sosumi.xyz update feed";

    function generateRSS() {
      const items = updates.map(update => `
        <item>
          <title>${update.title}</title>
          <link>${update.link || siteLink}</link>
          <description><![CDATA[${update.text}]]></description>
          <pubDate>${update.date}</pubDate>
        </item>`).join("\n");

      return `<?xml version="1.0" encoding="UTF-8" ?>
<rss version="2.0">
<channel>
  <title>${siteTitle}</title>
  <link>${siteLink}</link>
  <description>${siteDescription}</description>
  <lastBuildDate>${new Date().toUTCString()}</lastBuildDate>
  ${items}
</channel>
</rss>`;
    }

    function renderUpdates() {
      const container = document.getElementById("updatesList");
      container.innerHTML = "";
      updates.forEach((u, i) => {
        const div = document.createElement("div");
        div.className = "update-item";

        const text = document.createElement("div");
        text.className = "update-text";
        text.textContent = `${u.title}: ${u.text}\nLink: ${u.link || "(default)"}`;

        const delBtn = document.createElement("button");
        delBtn.textContent = "Delete";
        delBtn.onclick = () => {
          updates.splice(i, 1);
          document.getElementById("rssOutput").value = generateRSS();
          renderUpdates();
        };

        div.appendChild(text);
        div.appendChild(delBtn);
        container.appendChild(div);
      });
    }

    document.getElementById("addUpdate").addEventListener("click", () => {
      const text = document.getElementById("updateText").value.trim();
      if (!text) return;

      const now = new Date();
      const custom = document.getElementById("customDate").value;
      const date = custom ? new Date(custom) : now;

      const link = document.getElementById("customLink").value.trim();

      updates.unshift({
        title: "Update " + date.toLocaleString(),
        text: text,
        date: date.toUTCString(),
        link: link || ""
      });

      document.getElementById("rssOutput").value = generateRSS();
      document.getElementById("updateText").value = "";
      document.getElementById("customDate").value = "";
      document.getElementById("customLink").value = "";
      renderUpdates();
    });

    document.getElementById("downloadFeed").addEventListener("click", () => {
      const blob = new Blob([generateRSS()], { type: "application/xml" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "feed.xml";
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("fileInput").addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        parseFeedXML(e.target.result);
      };
      reader.readAsText(file);
    });

    function parseFeedXML(xmlText) {
      const parser = new DOMParser();
      const xml = parser.parseFromString(xmlText, "application/xml");
      const items = xml.getElementsByTagName("item");

      updates.length = 0; // clear existing
      for (let i = 0; i < items.length; i++) {
        const title = items[i].getElementsByTagName("title")[0]?.textContent || "Untitled";
        const description = items[i].getElementsByTagName("description")[0]?.textContent || "";
        const pubDate = items[i].getElementsByTagName("pubDate")[0]?.textContent || new Date().toUTCString();
        const link = items[i].getElementsByTagName("link")[0]?.textContent || "";

        updates.push({
          title: title,
          text: description,
          date: pubDate,
          link: link
        });
      }

      document.getElementById("rssOutput").value = generateRSS();
      renderUpdates();
    }

    // --- Auto-load feed.xml if it exists in same directory ---
    async function autoLoadFeed() {
      try {
        const response = await fetch("feed.xml");
        if (!response.ok) throw new Error("Feed not found");
        const text = await response.text();
        parseFeedXML(text);
        console.log("feed.xml loaded automatically");
      } catch (err) {
        console.warn("No existing feed.xml found or blocked by browser:", err.message);
      }
    }

    window.addEventListener("DOMContentLoaded", autoLoadFeed);
  </script>
</body>
</html>
