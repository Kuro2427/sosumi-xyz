        transform: translate(-50%, -50%);

    }


    .back {
        color: white;

        padding: 2px;
    }

    .sheared-box {
      width: 200px;
      height: 200px;
      background: linear-gradient(135deg, #ff0080, #00f0ff);
      animation: shear-swing 3s infinite ease-in-out;
      /* Start with a neutral shear */
      clip-path: polygon(
        20px 0%, calc(100% - 20px) 0%, 
        100% 100%, 0% 100%
      );
    }

    @keyframes colorRotate {
    from {
        color: #6666ff;
    }
    10% {
        color: #0099ff;
    }
    50% {
        color: #00ff00;
    }
    75% {
        color: #ff3399;
    }

    }
