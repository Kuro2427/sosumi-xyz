<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><!--# block name="title" -->sosumi.xyz | Interrobang!<!--# endblock --></title>
    <meta name="description" content="<!--# block name="description" -->Interrobang?! - sosumi's personal blog<!--# endblock -->">
    <meta name="author" content="sosumi">
    <meta name="keywords" content="<!--# block name="tags" -->blog, personal, sosumi, interrobang, tech, music, gaming, anime<!--# endblock -->">
    <link rel="stylesheet" href="/assets/style.css">
    <link rel="stylesheet" href="" id="pageStyle">
</head>

<style>
    /* Layout specific styles */

    main {
        max-width: 600px;
        margin: auto;
        padding: 1rem;
    }
    
    /* Header styles */
    header{
        margin-top: -10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        border-bottom: 1px solid black;
        margin-bottom: 10px;
    }

    header nav {
        font-weight: bold;
        margin-top: -10px;
    }

    header nav ul {
        list-style: none;
        padding: 0;
        display: flex;
        gap: 1rem;
        justify-content: center;
    }


    /* Article styles */
    .articleTitle {
        font-size: 2rem;
        font-weight: bold;
        margin-bottom: 0px;
        margin-top: 10px;
    }

    .pubDate {
        margin: 0px;
    }

    article img{
        image-rendering: auto;
        filter: none;
    }

    .drop::first-letter{
        font-size: 2rem;
        font-weight: bold;
        float: left;
        line-height: 1;
        padding-right: 8px;
        padding-left: 2px;
    }

    .citation{
        font-size: 10px;
        vertical-align: super;
    }

    footer{
        margin-top: 20px;
        border-top: 1px solid black;
        padding-top: 10px;
    }

    /* Image styles */

    .bigImg{
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 10px;
    }

    .bigImg img{
        width: 100%;
        height: auto;
        padding: 10px;
        border: 1px solid black;
    }

    .leftImg img, .rightImg img{
        width: 250px;
        height: auto;
        padding: 10px;
        border: 1px solid black;
    }

    .rightImg{
        float: right;
        margin-left: 20px;
    }

    .leftImg{
        float: left;
        margin-right: 20px;
    }

    .rightImg, .leftImg{
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    figcaption{
        text-align: center;
    }

    /* Blockquote styles */

    blockquote::before{
        content: "“";
        font-size: 80px;
        position: absolute;
        margin-left: -40px;
        margin-top: -20px;
    }

    blockquote{
        margin: 0px;
        padding: 5px 5px 5px 20px;
        border: 1px solid black;
    }

    blockquote .quoteCredit{
        text-align: right;
        color: rgb(73, 73, 73);
        margin-top: -15px;
    }

    /*Archive*/
    .archiveArticle{
        border-top: 1px solid black;
        padding: 10px;
        margin-bottom: 10px;
    }

    .tag{
        border: 1px solid black;
        padding: 2px 5px;
    }

    .archiveTitle{
        font-weight: bold;
        margin: 0px 10px;
    }


    /*make floating images responsive*/
    @media (max-width: 600px) {
        .rightImg, .leftImg {
            float: none;
            margin: auto;
        }
    }


</style>

<body>

    <main>
        <header>
            <a href="/blog/"><img src="/newblog/logo.png" alt="Interrobang?! (sosumi's blog)" style="padding: 0px; margin: 0px;"></a>
            <nav>
                <ul>
                    <li><a href="/home">sosumi.xyz</a></li>
                    <li><a href="/aboutme/">about me</a></li>
                    <li><a href="/feed.xml">rss</a></li>
                </ul>
            </nav>
        </header>

        <article>
            <!--# block name="content" -->
                <a href="https://youtu.be/gxEPV4kolz0?list=RDgxEPV4kolz0&t=277">Man, what are you doing here?</a>
            <!--# endblock -->
        </article>
    </main>
    <script src="/assets/themeswitcher.js"></script>
    
    <script>
        //Scroll reference links into view smoothly
        function jumpTo(id){
            document.getElementById(id).scrollIntoView({behavior: "smooth"});
        }
    </script>

    <script>
        //Blog archive filtering
        function filterArticles(){
            const select = document.getElementById("categorySelect");
            const selectedCategory = select.value;
            const articles = document.getElementsByClassName("archiveArticle");

            for(let article of articles){
                if(selectedCategory === "all" || article.id === selectedCategory){
                    article.style.display = "block";
                } else {
                    article.style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
