<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not found!</title>
</head>
<style>
    body{
        background-color: rgb(122, 150, 109);
        background-image: url('/assets/shiggy.gif');
        max-width: 500px;
        text-align: center;
        font-family: 'MS PGothic',monospace;

        margin: 0;
        position: absolute;
        top: 50%;
        left: 50%;
        -ms-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
    }

    p,h1{
        background-color: #C6CEA5;
    }
    
</style>
<body>
    <h1>Page not found</h1>
    <audio src="/assets/punani.mp3" autoplay></audio>
    <p><a href="#" onclick="window.history.back()" id="backlink"><- <span id="back">Return to the previous page?</span></a></p>

    <script>
        let chance = Math.floor(Math.random() * (9 - 0 + 1)) + 0;
        text = document.getElementById('back');
        console.log(chance);
        if(chance==9){
            text.textContent="Get back to where you once belonged"
        }
    </script>

    <script>
        let eggchance = Math.floor(Math.random() * (30 - 0 + 1)) + 0;
        link = document.getElementById('backlink');
        text = document.getElementById('back');
        console.log(eggchance);
        if(eggchance==30){
            link.href="/egg"
            link.onClick=null;
            text.textContent="Back?"
        }
    </script>
</body>
</html>
